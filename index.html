<title>雾港守望 · 潮汐防线</title>
<style>
:root{color-scheme:dark;--ink:#eaf8ee;--muted:#9bb9ba;--glass:#103847;--line:rgba(198,236,218,.16);--mint:#a9edbf;--gold:#f6d986;--coral:#ff927c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 16% 3%,#1b5260 0,transparent 34%),radial-gradient(ellipse at 92% 17%,#1e5360 0,transparent 32%),linear-gradient(145deg,#092331,#0c3441 55%,#0a2835);font-family:ui-rounded,"SF Pro Rounded","Noto Sans SC",system-ui,sans-serif;color:var(--ink);padding:28px 20px 36px;overflow-x:hidden}button{font:inherit}.app{width:min(1120px,100%);margin:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:17px}.brand{display:flex;align-items:center;gap:13px}.sigil{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#b0ecc3,#61b99d);box-shadow:0 8px 24px #5cb99a3b;display:grid;place-items:center;color:#12394a;font-size:23px}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#a8d4c1;font-weight:800;margin-bottom:3px}.brand h1{font-size:22px;line-height:1.1;margin:0;letter-spacing:.05em}.header-note{color:#a8c6c2;font-size:12px;letter-spacing:.08em}.intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 2px 16px}.intro h2{font-size:clamp(20px,3vw,29px);line-height:1.25;margin:0 0 6px;letter-spacing:.04em}.intro p{font-size:13px;color:#adc7c3;margin:0}.tag{padding:7px 11px;border:1px solid #b0ecc344;background:#a9edbf12;color:#bcf0ca;border-radius:99px;font-size:11px;white-space:nowrap}.console{background:linear-gradient(180deg,#133f4cdd,#0b2b39ee);border:1px solid #b6e9d51d;border-radius:24px;padding:16px;box-shadow:0 30px 80px #04192366;backdrop-filter:blur(10px)}.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}.stat{min-height:40px;display:flex;align-items:center;gap:9px;padding:7px 12px;border:1px solid var(--line);background:#092c39bd;border-radius:13px}.stat .ico{font-size:16px}.stat-label{font-size:9px;color:#9dbab8;letter-spacing:.13em;text-transform:uppercase}.stat-value{font-size:13px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.stat-value em{font-style:normal;color:var(--gold)}.status{margin-left:auto;color:#b6d2c7;font-size:11px;letter-spacing:.04em;display:flex;align-items:center;gap:7px}.pulse{width:7px;height:7px;border-radius:50%;background:#92dfaa;box-shadow:0 0 12px #92dfaa}.button{border:0;border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}.button:hover{transform:translateY(-1px);filter:brightness(1.07)}.button:active{transform:translateY(1px)}.primary{color:#123a48;background:linear-gradient(135deg,#b7f0c9,#71c8a6);box-shadow:0 8px 18px #78d0aa32}.secondary{color:#c5dfd5;background:#174452;border:1px solid #b6e9d52b}.button:disabled{opacity:.55;cursor:not-allowed;transform:none}.board-wrap{border-radius:17px;overflow:hidden;border:1px solid #c7f2d626;position:relative;background:#102d38}.board{width:100%;height:auto;display:block;touch-action:manipulation}.message{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#071d29a8;backdrop-filter:blur(5px);padding:20px}.message.show{display:flex}.message-card{width:min(420px,100%);padding:25px;text-align:center;border-radius:22px;background:linear-gradient(150deg,#164554,#0b2b39);border:1px solid #c2edd33b;box-shadow:0 25px 70px #06192399}.message-card .stamp{font-size:32px;margin-bottom:8px}.message-card h3{font-size:24px;margin:0 0 8px}.message-card p{font-size:13px;line-height:1.7;color:#afc9c3;margin:0 0 18px}.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:13px}.unit-card{position:relative;text-align:left;min-height:86px;padding:12px 13px 11px 54px;border:1px solid #c2ead124;border-radius:15px;background:linear-gradient(145deg,#123e4b,#0c303d);color:var(--ink);cursor:pointer;transition:.16s;overflow:hidden}.unit-card:hover{border-color:#b0edc977;transform:translateY(-2px)}.unit-card.selected{border-color:#a9edbf;background:linear-gradient(145deg,#1a5a5d,#11414d);box-shadow:0 0 0 2px #a9edbf24,0 8px 22px #010f1640}.unit-card.unaffordable{opacity:.53}.card-icon{position:absolute;left:13px;top:17px;width:30px;height:36px;border-radius:12px 12px 10px 10px;background:#a9edbf1c;display:grid;place-items:center;font-size:21px}.unit-name{font-weight:800;font-size:13px;display:block;margin:1px 0 5px}.unit-desc{display:block;color:#a9c6bf;font-size:10px;line-height:1.35}.cost{position:absolute;right:10px;top:10px;font-weight:900;font-size:11px;color:var(--gold)}.below{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:13px 2px 0;color:#9ab9b6;font-size:11px;line-height:1.5}.below strong{color:#c9e7d4}.hint{display:flex;align-items:center;gap:8px}.kbd{border:1px solid #c1ded32a;background:#0d303d;border-radius:6px;padding:2px 6px;color:#cce3d5;font-size:10px}.legend{display:flex;gap:13px;align-items:center;flex-wrap:wrap}.legend span{display:inline-flex;gap:5px;align-items:center}.footer{display:flex;justify-content:space-between;gap:12px;margin:15px 3px 0;color:#729397;font-size:10px;letter-spacing:.04em}.footer a{color:#9ebcb5;text-decoration:none}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:11px 16px;background:#edf9e7;color:#163d42;border-radius:12px;font-size:13px;font-weight:800;box-shadow:0 12px 36px #0005;transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:660px){body{padding:15px 10px 25px}.console{padding:10px;border-radius:19px}.topline{margin-bottom:13px}.brand h1{font-size:19px}.header-note{display:none}.intro{align-items:start}.intro p{font-size:11px;max-width:290px}.tag{font-size:9px;padding:6px 8px}.hud{gap:6px}.stat{padding:6px 8px;min-height:36px;gap:6px}.stat .ico{font-size:14px}.stat-label{font-size:8px}.stat-value{font-size:11px}.status{width:100%;order:9;margin:0 0 0 3px}.button{padding:8px 10px;font-size:11px}.deck{gap:6px}.unit-card{padding:10px 8px 9px 41px;min-height:74px;border-radius:12px}.card-icon{width:25px;height:30px;left:9px;top:15px;font-size:18px}.unit-name{font-size:11px}.unit-desc{font-size:9px}.cost{right:7px;top:7px;font-size:10px}.below{align-items:flex-start;font-size:10px}.hint{max-width:70%}.legend{display:none}.footer{font-size:9px}}
@media(max-width:390px){.deck{grid-template-columns:1fr}.unit-card{min-height:58px;padding-left:52px}.card-icon{top:12px}.cost{top:10px}.tag{display:none}}
</style>

<body>
<main class="app">
  <div class="topline"><div class="brand"><div class="sigil">✦</div><div><div class="eyebrow">LANTERNKEEPERS · TIDELINE 07</div><h1>雾港守望</h1></div></div><div class="header-note">雾起之前，点亮每一条归航路</div></div>
  <section class="intro"><div><h2>今夜，潮声有些不对。</h2><p>在五条海堤上安放守望者，别让雾中来客靠近灯塔。</p></div><div class="tag">原创 · 单人守线</div></section>
  <section class="console" aria-label="游戏区域">
    <div class="hud">
      <div class="stat"><span class="ico">💧</span><div><div class="stat-label">露珠</div><div class="stat-value" id="dew">100</div></div></div>
      <div class="stat"><span class="ico">🕯</span><div><div class="stat-label">灯塔余烬</div><div class="stat-value" id="hearts"><em>♥ ♥ ♥ ♥ ♥</em></div></div></div>
      <div class="stat"><span class="ico">🌊</span><div><div class="stat-label">潮汐</div><div class="stat-value" id="wave">序潮 · 0:00</div></div></div>
      <div class="status"><i class="pulse"></i><span id="statusText">守夜人已就位</span></div>
      <button class="button primary" id="startBtn">开始守夜</button><button class="button secondary" id="pauseBtn" disabled>暂停</button><button class="button secondary" id="restartBtn">重来</button>
    </div>
    <div class="board-wrap"><canvas class="board" id="board" width="960" height="560" aria-label="五条海堤防线，可点击格子部署守护者"></canvas><div class="message" id="message"><div class="message-card"><div class="stamp" id="messageIcon">🌙</div><h3 id="messageTitle"></h3><p id="messageText"></p><button class="button primary" id="messageBtn">再守一夜</button></div></div></div>
    <div class="deck" id="deck">
      <button class="unit-card" data-unit="glow"><span class="card-icon">✹</span><span class="cost">50 💧</span><span class="unit-name">萤芽投手</span><span class="unit-desc">向同一海堤发射萤光籽</span></button>
      <button class="unit-card" data-unit="tide"><span class="card-icon">❋</span><span class="cost">35 💧</span><span class="unit-name">潮汐花</span><span class="unit-desc">每隔一会儿凝成露珠</span></button>
      <button class="unit-card" data-unit="shell"><span class="card-icon">⬟</span><span class="cost">40 💧</span><span class="unit-name">礁壳卫</span><span class="unit-desc">厚实外壳，拦住雾中来客</span></button>
    </div>
    <div class="below"><div class="hint"><span class="kbd">1–3</span> 选择守望者 <span class="kbd">点击海堤</span> 部署 <strong>·</strong> 收集漂来的露珠</div><div class="legend"><span>✹ 萤芽投手</span><span>❋ 潮汐花</span><span>⬟ 礁壳卫</span></div></div>
  </section>
  <div class="footer"><span>雾港巡潮局 · 第七码头</span><span>守住灯火，直到潮雾退去</span></div>
</main>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
const W=960,H=560, rows=5,cols=7, sx=128,sy=87,cw=112,ch=84;
const $=id=>document.getElementById(id);
const cfg={glow:{cost:50,hp:110,name:'萤芽投手'},tide:{cost:35,hp:85,name:'潮汐花'},shell:{cost:40,hp:390,name:'礁壳卫'}};
let units=[],foes=[],shots=[],dewdrops=[],particles=[],selected=null,dew=100,hearts=5,elapsed=0,spawned=0,active=false,paused=false,ended=false,last=0,autoDew=0,nextSpawn=3,toastTimer=0;
const totalFoes=12;
const rand=(a,b)=>a+Math.random()*(b-a);
function reset(){units=[];foes=[];shots=[];dewdrops=[];particles=[];dew=100;hearts=5;elapsed=0;spawned=0;active=false;paused=false;ended=false;last=0;autoDew=0;nextSpawn=3;selected=null;$('message').classList.remove('show');$('startBtn').disabled=false;$('pauseBtn').disabled=true;$('pauseBtn').textContent='暂停';$('statusText').textContent='守夜人已就位';updateHud();renderDeck();draw();}
function updateHud(){ $('dew').textContent=dew;$('hearts').innerHTML=`<em>${'♥ '.repeat(hearts).trim()}${'♡ '.repeat(5-hearts).trim()}</em>`;$('wave').textContent=`${elapsed<24?'序潮':elapsed<58?'涨潮':'雾潮'} · ${fmt(elapsed)}`; }
function fmt(sec){let s=Math.floor(sec);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function renderDeck(){document.querySelectorAll('.unit-card').forEach(b=>{b.classList.toggle('selected',b.dataset.unit===selected);b.classList.toggle('unaffordable',dew<cfg[b.dataset.unit].cost)})}
function toast(text){const t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}
function start(){if(ended)reset();active=true;paused=false;$('startBtn').disabled=true;$('pauseBtn').disabled=false;$('statusText').textContent='灯火已点亮，留意雾线';last=performance.now();requestAnimationFrame(loop);}
function finish(win){active=false;paused=false;ended=true;$('pauseBtn').disabled=true;$('startBtn').disabled=false;$('statusText').textContent=win?'潮雾退去，港湾安宁':'灯塔熄灭，守夜结束';$('messageIcon').textContent=win?'🌅':'🌫';$('messageTitle').textContent=win?'守住了雾港！':'雾潮漫过海堤';$('messageText').textContent=win?`你守住了 ${fmt(elapsed)}，${spawned} 位雾中来客都已退散。灯塔的光又照到了远海。`:'灯塔余烬耗尽了。换一条海堤布防，下一夜还来得及。';$('messageBtn').textContent=win?'再守一夜':'重新布防';$('message').classList.add('show');}
function togglePause(){if(!active||ended)return;paused=!paused;$('pauseBtn').textContent=paused?'继续':'暂停';$('statusText').textContent=paused?'夜潮暂歇':'灯火已点亮，留意雾线';if(!paused){last=performance.now();requestAnimationFrame(loop)}draw()}
function select(type){if(ended)return;selected=selected===type?null:type;renderDeck();if(selected)toast(`${cfg[selected].name}：选择一条海堤部署`)}
document.querySelectorAll('.unit-card').forEach((b,i)=>{b.addEventListener('click',()=>select(b.dataset.unit));});
$('startBtn').addEventListener('click',start);$('pauseBtn').addEventListener('click',togglePause);$('restartBtn').addEventListener('click',reset);$('messageBtn').addEventListener('click',reset);
window.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='3')select(['glow','tide','shell'][Number(e.key)-1]);if(e.key===' '){e.preventDefault();if(!active&&!ended)start();else togglePause()}if(e.key==='Escape'){selected=null;renderDeck()}});
function placeAt(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const col=Math.floor((x-sx)/cw),row=Math.floor((y-sy)/ch);if(col<0||col>=cols||row<0||row>=rows){if(x>sx&&y>sy&&selected)toast('请把守望者放在海堤格子里');return}if(!selected){const spot=units.find(u=>u.col===col&&u.row===row);if(spot)toast(`${spot.name} · 耐久 ${Math.max(0,Math.ceil(spot.hp))}`);else toast('先在下方选择一位守望者');return}if(units.some(u=>u.col===col&&u.row===row)){toast('这格海堤已经有人值守');return}const c=cfg[selected];if(dew<c.cost){toast('露珠不够，点收漂来的露珠或等待潮汐花');return}dew-=c.cost;units.push({type:selected,col,row,x:sx+col*cw+cw/2,y:sy+row*ch+ch/2,hp:c.hp,max:c.hp,shoot:rand(.2,.8),produce:6});for(let i=0;i<9;i++)particles.push({x:sx+col*cw+cw/2,y:sy+row*ch+ch/2,vx:rand(-26,26),vy:rand(-46,-10),life:rand(.4,.8),max:.8,color:'#b9f6bd'});selected=null;renderDeck();updateHud();draw()}
canvas.addEventListener('pointerdown',placeAt);
function spawnFoe(){const row=Math.floor(Math.random()*rows);let type='drifter';if(spawned===totalFoes-1)type='brute';else if(spawned%4===3)type='skater';const spec={drifter:{hp:92,speed:13.5,damage:20,color:'#eea684',scale:1},skater:{hp:70,speed:22,damage:18,color:'#8fd3c3',scale:.88},brute:{hp:440,speed:8,damage:30,color:'#d28cb1',scale:1.55}}[type];foes.push({type,row,x:W+25,y:sy+row*ch+ch/2+3,hp:spec.hp,max:spec.hp,speed:spec.speed,damage:spec.damage,color:spec.color,scale:spec.scale,attack:0,phase:rand(0,6)});spawned++;for(let i=0;i<8;i++)particles.push({x:W-18,y:sy+row*ch+ch/2,vx:rand(-20,10),vy:rand(-20,20),life:.7,max:.7,color:'#c6d7eb'});}
function update(dt){elapsed+=dt;autoDew+=dt;if(autoDew>7.5){autoDew-=7.5;dew+=15;toast('潮汐送来 15 颗露珠');}
if(spawned<totalFoes&&elapsed>=nextSpawn){spawnFoe();nextSpawn=elapsed+Math.max(3.5,6.8-spawned*.18)}
for(const u of units){if(u.type==='tide'){u.produce-=dt;if(u.produce<=0){u.produce=7.5;dewdrops.push({x:u.x+rand(-12,12),y:u.y-18,vy:0,ttl:10,phase:rand(0,6)});}}else if(u.type==='glow'){u.shoot-=dt;if(u.shoot<=0){const target=foes.find(f=>f.row===u.row&&f.x>u.x+8);if(target){u.shoot=1.45;shots.push({x:u.x+24,y:u.y-7,row:u.row,speed:245,damage:34,phase:0});}}}}
for(const s of shots){s.x+=s.speed*dt;s.phase+=dt*8;const f=foes.find(f=>f.row===s.row&&Math.abs(f.x-s.x)<18+f.scale*7);if(f){f.hp-=s.damage;s.x=-100;for(let i=0;i<4;i++)particles.push({x:f.x,y:f.y,vx:rand(-20,20),vy:rand(-28,10),life:.28,max:.28,color:'#e1ffad'});}}
shots=shots.filter(s=>s.x>0&&s.x<W+20);for(const f of foes){const blocker=units.find(u=>u.row===f.row&&Math.abs(f.x-u.x)<28);if(blocker){f.attack-=dt;if(f.attack<=0){blocker.hp-=f.damage;f.attack=.85;} }else f.x-=f.speed*dt;if(f.x<sx-37){hearts=Math.max(0,hearts-1);f.hp=-999;for(let i=0;i<16;i++)particles.push({x:sx-8,y:f.y,vx:rand(-60,25),vy:rand(-56,25),life:.8,max:.8,color:'#ff997f'});if(hearts<=0){updateHud();finish(false);return;}}}
foes=foes.filter(f=>f.hp>0);units=units.filter(u=>u.hp>0);
for(const d of dewdrops){d.ttl-=dt;d.phase+=dt*3;d.y+=Math.sin(d.phase)*dt*2;}
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;}particles=particles.filter(p=>p.life>0);dewdrops=dewdrops.filter(d=>d.ttl>0);
if(spawned>=totalFoes&&foes.length===0&&elapsed>25){finish(true);return}updateHud();renderDeck();}
function loop(now){if(!active||paused||ended)return;const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);draw();if(active&&!paused)requestAnimationFrame(loop)}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#173e4b');sky.addColorStop(.52,'#1a4a51');sky.addColorStop(1,'#103945');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// distant fog and moon
ctx.save();ctx.globalAlpha=.14;ctx.fillStyle='#d7f0ce';ctx.beginPath();ctx.arc(799,57,27,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.09;for(let i=0;i<7;i++){ctx.fillStyle=i%2?'#8fc7bb':'#d0e8ca';ctx.beginPath();ctx.ellipse(170+i*145,65+(i%3)*12,95,9+(i%2)*5,0,0,Math.PI*2);ctx.fill()}ctx.restore();
// lighthouse at left
ctx.save();ctx.shadowColor='#ffd875';ctx.shadowBlur=18;ctx.fillStyle='#ffd97f';ctx.globalAlpha=.17;ctx.beginPath();ctx.moveTo(65,84);ctx.lineTo(144,216);ctx.lineTo(65,218);ctx.closePath();ctx.fill();ctx.restore();
ctx.fillStyle='#d5e7d0';ctx.beginPath();ctx.moveTo(47,59);ctx.lineTo(71,59);ctx.lineTo(78,102);ctx.lineTo(42,102);ctx.closePath();ctx.fill();rr(41,100,38,421,13,'#527f79','#b2d4bd');rr(47,109,26,401,9,'#658e82');ctx.fillStyle='#f2d88b';ctx.fillRect(43,88,34,17);rr(48,67,22,19,5,'#ffdf91');ctx.fillStyle='#fef2c4';ctx.beginPath();ctx.arc(59,77,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d3e3c7';ctx.beginPath();ctx.moveTo(34,519);ctx.quadraticCurveTo(59,507,84,519);ctx.lineTo(84,538);ctx.lineTo(34,538);ctx.fill();
// terrain lanes
for(let r=0;r<rows;r++){const y=sy+r*ch;const col=r%2?'#204e50':'#28564f';rr(sx,y,cols*cw,ch-3,10,col,'#a7d6ad22');ctx.fillStyle=r%2?'#315f55':'#376457';ctx.globalAlpha=.55;for(let j=0;j<8;j++){const px=sx+32+j*105+(r%2)*13,py=y+randStable(r,j)*48+20;ctx.beginPath();ctx.ellipse(px,py,17,3.1,-.08,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(let c=0;c<cols;c++){const x=sx+c*cw;ctx.strokeStyle='rgba(193,233,193,.095)';ctx.lineWidth=1;ctx.strokeRect(x,y,cw,ch);}}
// columns/coordinates
ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillStyle='#a4c8b8';for(let c=0;c<cols;c++)ctx.fillText(['外礁','浅滩','苔堤','潮池','石桥','芦湾','雾线'][c],sx+c*cw+cw/2,sy-10);ctx.textAlign='left';
// subtle shimmer
for(let i=0;i<18;i++){let px=((i*79+elapsed*8)%(W-130))+108,py=67+(i%4)*122;ctx.globalAlpha=.15+.1*Math.sin(elapsed*2+i);ctx.fillStyle='#bbebd0';ctx.fillRect(px,py,2,2)}ctx.globalAlpha=1;
// idle attract scene: static original defenders and visitor
if(!active&&!ended&&units.length===0&&foes.length===0){drawUnit({type:'tide',x:sx+cw*.5+cw*1,y:sy+ch*2+ch/2,hp:85,max:85,shoot:0,produce:5},true);drawUnit({type:'glow',x:sx+cw*3+cw/2,y:sy+ch+ch/2,hp:110,max:110,shoot:0,produce:0},true);drawUnit({type:'shell',x:sx+cw*4+cw/2,y:sy+ch*3+ch/2,hp:340,max:390,shoot:0,produce:0},true);drawFoe({type:'drifter',x:sx+cols*cw-47,y:sy+ch*2+ch/2,hp:92,max:92,color:'#eea684',scale:1,phase:0},true);}
for(const u of units)drawUnit(u,false);for(const d of dewdrops)drawDrop(d);for(const s of shots){ctx.save();ctx.shadowColor='#d4ffa5';ctx.shadowBlur=13;ctx.fillStyle='#e5ffb0';ctx.beginPath();ctx.arc(s.x,s.y,7+Math.sin(s.phase)*1.3,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#f1ffe0';ctx.beginPath();ctx.arc(s.x-2,s.y-2,2,0,Math.PI*2);ctx.fill()}
for(const f of foes)drawFoe(f,false);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
// hovering resource drops
for(const d of dewdrops){ctx.save();ctx.shadowColor='#9ef5da';ctx.shadowBlur=14;ctx.fillStyle='#a7f4d1';ctx.beginPath();ctx.moveTo(d.x,d.y-9);ctx.bezierCurveTo(d.x+10,d.y+2,d.x+7,d.y+10,d.x,d.y+10);ctx.bezierCurveTo(d.x-9,d.y+10,d.x-10,d.y+2,d.x,d.y-9);ctx.fill();ctx.restore();ctx.fillStyle='#e4fff0';ctx.beginPath();ctx.arc(d.x-2,d.y-2,2,0,Math.PI*2);ctx.fill()}
if(selected){ctx.save();ctx.strokeStyle='#c9ffb1';ctx.lineWidth=2;ctx.setLineDash([6,5]);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!units.some(u=>u.col===c&&u.row===r)){ctx.strokeRect(sx+c*cw+6,sy+r*ch+6,cw-12,ch-15)}ctx.restore();}
// top right tide beacon
ctx.fillStyle='#c3e4cb';ctx.font='11px system-ui';ctx.textAlign='right';ctx.fillText(active?'守夜进行中':'雾港 · 五道海堤',W-18,27);ctx.textAlign='left';
}
function randStable(a,b){const n=Math.sin(a*91.7+b*22.4)*43758.5;return n-Math.floor(n)}
function drawUnit(u,preview){const x=u.x,y=u.y;ctx.save();ctx.translate(x,y);if(u.type==='glow'){
// glowing seed-sling sprout
ctx.fillStyle='#3c936d';ctx.beginPath();ctx.ellipse(-1,16,9,14,-.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#72c899';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-2,20);ctx.quadraticCurveTo(-5,3,-8,-8);ctx.stroke();ctx.fillStyle='#83d59c';ctx.beginPath();ctx.ellipse(-13,6,10,5,-.45,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(6,9,10,5,.5,0,Math.PI*2);ctx.fill();ctx.shadowColor='#efffa7';ctx.shadowBlur=19;ctx.fillStyle='#d8ff9e';ctx.beginPath();ctx.arc(9,-9,13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff7d5';ctx.beginPath();ctx.arc(12,-12,4.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#295553';ctx.beginPath();ctx.arc(14,-10,1.7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e8faad';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(21,-9);ctx.lineTo(28,-9);ctx.stroke();
}else if(u.type==='tide'){
// layered tide flower
ctx.fillStyle='#318c7e';ctx.beginPath();ctx.ellipse(0,18,16,8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#70c9a1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,17);ctx.lineTo(0,0);ctx.stroke();for(let i=0;i<7;i++){const a=i*Math.PI*2/7;ctx.fillStyle=i%2?'#86dfbb':'#b5efc6';ctx.beginPath();ctx.ellipse(Math.cos(a)*9,Math.sin(a)*9-5,6,10,a,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#f9df9a';ctx.beginPath();ctx.arc(0,-5,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#96e4bf';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-5,18,Math.PI*1.1,Math.PI*1.85);ctx.stroke();
}else{
// reef-shell guardian
ctx.fillStyle='#3c8575';ctx.beginPath();ctx.ellipse(0,15,23,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d5bc83';ctx.beginPath();ctx.moveTo(-22,13);ctx.quadraticCurveTo(-24,-13,0,-21);ctx.quadraticCurveTo(26,-13,22,14);ctx.quadraticCurveTo(0,25,-22,13);ctx.fill();ctx.strokeStyle='#8e9c70';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='#a18f64';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(0,18);ctx.moveTo(-14,-12);ctx.lineTo(-10,15);ctx.moveTo(14,-12);ctx.lineTo(10,15);ctx.stroke();ctx.fillStyle='#f4e7b4';ctx.beginPath();ctx.arc(-6,-2,2,0,Math.PI*2);ctx.arc(6,-2,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#38615a';ctx.beginPath();ctx.arc(-6,-2,1,0,Math.PI*2);ctx.arc(6,-2,1,0,Math.PI*2);ctx.fill();}
if(!preview){const pct=Math.max(0,u.hp/u.max);ctx.fillStyle='#193d43';rr(-21,-30,42,4,2,'#193d43');rr(-21,-30,42*pct,4,2,pct>.45?'#a8e3aa':'#f2b880');}ctx.restore();}
function drawFoe(f,preview){const x=f.x,y=f.y;ctx.save();ctx.translate(x,y+Math.sin(elapsed*3+f.phase)*2);ctx.scale(f.scale,f.scale);ctx.globalAlpha=.18;ctx.fillStyle='#071d28';ctx.beginPath();ctx.ellipse(0,18,21,7,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// shadow-fog coat, two swaying feet
ctx.fillStyle=f.color;ctx.beginPath();ctx.moveTo(-13,16);ctx.quadraticCurveTo(-20,-7,-11,-21);ctx.quadraticCurveTo(-1,-33,12,-21);ctx.quadraticCurveTo(20,-7,14,15);ctx.quadraticCurveTo(7,8,1,17);ctx.quadraticCurveTo(-6,9,-13,16);ctx.fill();ctx.fillStyle='#6e7285';ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(0,-6,13,18,.1,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
// fin-like hood
ctx.fillStyle=f.type==='brute'?'#9a78a7':'#90aaa1';ctx.beginPath();ctx.moveTo(-11,-20);ctx.lineTo(-17,-34);ctx.lineTo(-4,-26);ctx.lineTo(3,-37);ctx.lineTo(5,-25);ctx.lineTo(16,-31);ctx.lineTo(11,-17);ctx.closePath();ctx.fill();
ctx.fillStyle='#fff0ca';ctx.beginPath();ctx.ellipse(-5,-12,3.2,4,0,0,Math.PI*2);ctx.ellipse(6,-12,3.2,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263f52';ctx.beginPath();ctx.arc(-4,-12,1.3,0,Math.PI*2);ctx.arc(7,-12,1.3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a65d71';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(1,-3,5,.15,Math.PI-.15);ctx.stroke();
if(!preview){ctx.fillStyle='#193d43';rr(-20,-43,40,4,2,'#193d43');rr(-20,-43,40*Math.max(0,f.hp/f.max),4,2,f.type==='brute'?'#dfa5c1':'#f2a88f');}ctx.restore();}
function drawDrop(d){ctx.save();ctx.shadowColor='#9ef5da';ctx.shadowBlur=14;ctx.fillStyle='#a7f4d1';ctx.beginPath();ctx.moveTo(d.x,d.y-9);ctx.bezierCurveTo(d.x+10,d.y+2,d.x+7,d.y+10,d.x,d.y+10);ctx.bezierCurveTo(d.x-9,d.y+10,d.x-10,d.y+2,d.x,d.y-9);ctx.fill();ctx.restore();ctx.fillStyle='#e4fff0';ctx.beginPath();ctx.arc(d.x-2,d.y-2,2,0,Math.PI*2);ctx.fill();}
canvas.addEventListener('pointerup',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;for(let i=dewdrops.length-1;i>=0;i--){const d=dewdrops[i];if(Math.hypot(x-d.x,y-d.y)<24){dew+=20;dewdrops.splice(i,1);updateHud();renderDeck();toast('+20 露珠');break}}});
reset();
})();
